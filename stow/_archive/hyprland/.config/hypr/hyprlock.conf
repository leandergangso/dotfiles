background {
    color = rgba(1e1e2eff)
}

# Time (Large Clock)
label {
    text = cmd[update:1000] echo "$(date +%H:%M)"
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    color = rgb(cdd6f4)
    position = 0, 120
    halign = center
    valign = center
}

# Date 
label {
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgb(94e2d5) # Catppuccin Teal
    position = 0, 50
    halign = center
    valign = center
}

# Password Input Field
input-field {
    size = 320, 48
    position = 0, -80
    halign = center
    valign = center
    outline_thickness = 2
    dots_center = true
    fade_on_empty = false
    placeholder_text = Password
    font_color = rgb(cdd6f4)
    inner_color = rgba(313244cc)
    outer_color = rgba(cba6f7ff)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
}

# User Greeting
label {
    text = $USER
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    color = rgb(bac2de)
    position = 0, -150
    halign = center
    valign = center
}
